<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>시세 데이터 갱신</title>
<link rel="stylesheet" href="../theme/hanwoo-theme.css">
<style>
  body { margin: 0; padding: 48px 16px; font-family: var(--font); background: var(--page); color: var(--ink); text-align: center; }
  h1 { font-size: 22px; font-weight: 600; }
  a.btn { display: inline-block; margin: 16px 0; padding: 12px 28px; border-radius: var(--radius-sm); background: var(--brand); color: #fff; font-size: 16px; font-weight: 600; text-decoration: none; }
  a.btn:hover { background: #0D1110; }
  p { line-height: 1.6; }
  .note { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
  <h1>한우 시세 데이터 갱신</h1>
  <p>"열기"를 확인하면 이 PC에서 업데이트(update_hanwoo_data.bat)가 시작됩니다.</p>
  <a class="btn" href="hanwoo-update://run">업데이트 실행</a>
  <p class="note">자동으로 열리지 않으면 위 버튼을 누르세요.<br>hanwoo-update 링크를 등록한 PC에서만 동작합니다. 이 창은 닫아도 됩니다.</p>
  <script>location.href = "hanwoo-update://run";</script>
</body>
</html>
