name: 한우 7일 시세 갱신

on:
  schedule:
    # 전날 시세가 10시경 올라온다. GitHub 예약 실행은 정각·30분에 몰려 수 시간 밀리므로
    # 오전~낮에 분을 어긋나게 여러 번 걸어 둔다. 변경이 없으면 커밋하지 않아 부작용이 없다.
    - cron: "13 23 * * *"  # 08:13 KST (UTC 전날 23:13)
    - cron: "12 0 * * *"   # 09:12 KST
    - cron: "17 1 * * *"   # 10:17 KST
    - cron: "7 2 * * *"    # 11:07 KST
    - cron: "23 3 * * *"   # 12:23 KST
  workflow_dispatch:        # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: hanwoo-7d
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 테스트 (실패하면 수집하지 않음)
        run: |
          python scripts/test_fetch_prices.py
          node scripts/test_hanwoo_7d.js

      - name: 시세 수집
        env:
          EKAPE_KEY: ${{ secrets.EKAPE_KEY }}
        run: python scripts/fetch_prices.py

      - name: 변경 시 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add data/hanwoo_7d.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "한우 7일 시세 자동 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
